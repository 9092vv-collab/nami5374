name: Build Nami (browser)
# Builds only when started by hand (Actions tab -> Run workflow, or Claude via the API).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fonts (Pretendard GOV)
        run: bash browser/fetch-fonts.sh
      - name: Get Gradle 8.14.3 (GitHub mirror)
        run: |
          F=gradle-8.14.3-bin.zip
          for i in 1 2 3; do
            curl -fL --retry 3 -o "$HOME/$F" "https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/$F" && break
            curl -fL --retry 3 -o "$HOME/$F" "https://services.gradle.org/distributions/$F" && break
            sleep 15
          done
          unzip -q "$HOME/$F" -d "$HOME"
          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      - name: Use Google's Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sgu-mirror.gradle <<'EOF'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def patch = { repos ->
            repos.withType(MavenArtifactRepository).configureEach { r ->
              def u = r.url.toString()
              if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) { r.url = MIRROR }
            }
          }
          beforeSettings { s ->
            patch(s.pluginManagement.repositories)
            patch(s.dependencyResolutionManagement.repositories)
          }
          EOF
      - name: Build release APK
        working-directory: browser
        run: |
          set -o pipefail
          for i in 1 2 3; do
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../gradle-browser.log && exit 0
            grep -q "Could not GET\|Gateway Time-out\|Connection reset\|Read timed out\|Could not download" ../gradle-browser.log || exit 1
            echo "::warning::attempt $i failed on a download, retrying"; sleep 30
          done
          exit 1
      - name: Sign (new key + rotation lineage from the old key)
        env:
          NAMI_KEY_PASS: ${{ secrets.NAMI_KEY_PASS }}
        run: |
          set -e
          if [ -z "$NAMI_KEY_PASS" ]; then echo "::error::secret NAMI_KEY_PASS is missing"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          K="$RUNNER_TEMP/nami.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in browser/signing/nami-release.jks.enc -out "$K" -pass env:NAMI_KEY_PASS
          IN=browser/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" \
            --old-signer --ks browser/app/sgu-next.keystore --ks-key-alias sgu --ks-pass pass:sgunext --key-pass pass:sgunext \
            --new-signer --ks "$K" --ks-key-alias nami --ks-pass env:NAMI_KEY_PASS --key-pass env:NAMI_KEY_PASS
          "$BT/apksigner" sign \
            --ks browser/app/sgu-next.keystore --ks-key-alias sgu --ks-pass pass:sgunext --key-pass pass:sgunext \
            --next-signer --ks "$K" --ks-key-alias nami --ks-pass env:NAMI_KEY_PASS --key-pass env:NAMI_KEY_PASS \
            --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 \
            --out browser/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify -v --print-certs browser/app/build/outputs/apk/release/app-release.apk | grep -E "Verified|Signer|SHA-256" | head -20
          rm -f "$K"
      - name: Publish (fixed link, tag browser-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp browser/app/build/outputs/apk/release/app-release.apk Nami.apk
          ls -la Nami.apk
          gh release delete browser-latest -R "${{ github.repository }}" --cleanup-tag -y || true
          gh release create browser-latest Nami.apk -R "${{ github.repository }}" --prerelease \
            --title "Nami (빌드 ${{ github.run_number }})" --notes "commit ${{ github.sha }}"
      - name: Save error log for Claude (branch build-logs)
        if: failure()
        run: |
          mkdir -p /tmp/logs
          {
            echo "browser run: ${{ github.run_number }}  commit: ${{ github.sha }}"
            if [ -f gradle-browser.log ]; then
              echo "===== errors ====="
              grep -n -B2 -A20 -E "^e: |What went wrong|error:|FAILED|Unresolved reference|Could not resolve" gradle-browser.log | head -400
              echo "===== last 120 lines ====="
              tail -120 gradle-browser.log
            fi
          } > /tmp/logs/latest.txt
          cd /tmp/logs
          git init -q && git checkout -q -b build-logs
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          git add latest.txt && git commit -qm "browser build log #${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
