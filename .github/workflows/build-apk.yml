name: Build SGU APK (Fold 8)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip (when uploaded from a phone)
        run: |
          if [ ! -f package.json ] && ls *.zip >/dev/null 2>&1; then
            unzip -o -q "$(ls *.zip | head -1)" -d .
          fi
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: bash scripts/install-deps.sh
      - name: Fonts (Pretendard GOV)
        run: bash scripts/fetch-fonts.sh
      - name: Generate Android project
        run: npx expo prebuild -p android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SGU-fold-apk
          path: android/app/build/outputs/apk/release/*.apk
