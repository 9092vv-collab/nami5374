name: Build SGU APK (Fold 8)
# Builds only when started by hand (Actions tab -> Run workflow, or Claude via the API).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip (when uploaded from a phone)
        run: |
          if [ ! -f package.json ] && ls *.zip >/dev/null 2>&1; then
            unzip -o -q "$(ls *.zip | head -1)" -d .
          fi
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: bash scripts/install-deps.sh
      - name: Fonts (Pretendard GOV)
        run: bash scripts/fetch-fonts.sh
      - name: Generate Android project
        run: npx expo prebuild -p android --no-install
      - name: Check app JavaScript bundle
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir /tmp/js-check 2>&1 | tee js-bundle.log
      - name: Get Gradle (GitHub mirror first, with retries)
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' "$P" | cut -d= -f2- | sed 's#\\:#:#g')
          F=$(basename "$URL")
          V=$(echo "$F" | sed -E 's/^gradle-(.*)-(bin|all)\.zip$/\1/')
          echo "Gradle $V ($F)"
          for u in "https://github.com/gradle/gradle-distributions/releases/download/v$V/$F" "$URL"; do
            for i in 1 2 3; do
              curl -fL --retry 3 --retry-delay 5 -o "$HOME/$F" "$u" && break 2
              sleep 15
            done
          done
          test -s "$HOME/$F"
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$HOME/$F#" "$P"
          cat "$P"
      - name: Use Google's Maven Central mirror (avoids timeouts)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sgu-mirror.gradle <<'EOF'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def patch = { repos ->
            repos.withType(MavenArtifactRepository).configureEach { r ->
              def u = r.url.toString()
              if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) { r.url = MIRROR }
            }
          }
          beforeSettings { s ->
            patch(s.pluginManagement.repositories)
            patch(s.buildscript.repositories)
            patch(s.dependencyResolutionManagement.repositories)
          }
          allprojects {
            patch(buildscript.repositories)
            patch(repositories)
          }
          EOF
          cat ~/.gradle/init.d/sgu-mirror.gradle
          curl -sSI "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.20/kotlin-compiler-embeddable-2.1.20.jar" | head -3 || true
      - name: Build release APK (retries on download timeouts)
        working-directory: android
        run: |
          for i in 1 2 3 4; do
            set -o pipefail
            ./gradlew assembleRelease --no-daemon \
              -Dorg.gradle.internal.repository.max.retries=10 \
              -Dorg.gradle.internal.repository.initial.backoff=3000 \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 2>&1 | tee -a ../gradle.log && exit 0
            grep -q "Could not GET\|Gateway Time-out\|Connection reset\|Read timed out" ../gradle.log || exit 1
            echo "::warning::Gradle attempt $i failed, retrying in 45s"
            sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: SGU-fold-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK as a release (fixed download link, no login needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk SGU-fold.apk
          V=$(node -p "require('./app.json').expo.version")
          TAG="v$V-build${{ github.run_number }}"
          gh release create "$TAG" SGU-fold.apk -R "${{ github.repository }}" --title "SGU 폴드 $V (빌드 ${{ github.run_number }})" --notes "commit ${{ github.sha }}" --latest
      - name: Save error log for Claude (branch build-logs)
        if: failure()
        run: |
          mkdir -p /tmp/logs
          {
            echo "run: ${{ github.run_number }}  commit: ${{ github.sha }}"
            for f in js-bundle.log gradle.log; do
              [ -f "$f" ] || continue
              echo; echo "===== $f : errors ====="
              grep -n -A25 -E "What went wrong|error:|Error:|ERROR|SyntaxError|Unable to resolve|FAILED" "$f" | head -400
              echo; echo "===== $f : last 150 lines ====="
              tail -150 "$f"
            done
          } > /tmp/logs/latest.txt
          cd /tmp/logs
          git init -q && git checkout -q -b build-logs
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          git add latest.txt && git commit -qm "build log #${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
